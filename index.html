<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Route R002</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117;--surface:#1a1d27;--card:#21253a;--accent:#f5a623;--accent2:#4fc3f7;
    --done:#2e7d32;--done-text:#81c784;--text:#e8eaf6;--muted:#7986cb;--border:#2e3256;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;min-height:100vh;overflow-x:hidden;}

  /* HEADER */
  .header{background:var(--surface);border-bottom:2px solid var(--accent);padding:12px 16px 10px;position:sticky;top:0;z-index:100;display:flex;flex-direction:column;gap:8px;}
  .header-top{display:flex;align-items:center;justify-content:space-between;}
  .route-label{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--accent);line-height:1;}
  .route-sub{font-size:10px;color:var(--muted);letter-spacing:1px;}
  .progress-wrap{display:flex;align-items:center;gap:10px;}
  .progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width 0.4s ease;}
  .progress-text{font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap;}
  .import-link{background:var(--card);border:1px solid var(--border);color:var(--accent2);border-radius:7px;padding:5px 12px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer;text-decoration:none;display:inline-block;}

  /* CURRENT BANNER */
  .current-banner{background:linear-gradient(135deg,#1b2a4a 0%,#1a2438 100%);border:1px solid var(--accent2);border-radius:12px;margin:12px 12px 0;padding:14px 16px;display:flex;flex-direction:column;gap:6px;}
  .current-label{font-size:10px;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;}
  .current-stop-num{font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--accent);line-height:1;}
  .current-stop-addr{font-size:15px;color:var(--text);font-weight:600;margin-top:2px;line-height:1.3;}
  .current-note{font-size:11px;color:#ffcc02;background:rgba(255,204,2,0.1);border-left:3px solid #ffcc02;padding:4px 8px;border-radius:0 4px 4px 0;display:none;}
  .nav-btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:13px 20px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background 0.2s;}
  .nav-btn:active{opacity:0.75;}
  .action-row{display:flex;gap:8px;}
  .action-btn{flex:1;padding:10px 8px;border:none;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;cursor:pointer;}
  .action-btn:active{opacity:0.7;}
  .btn-done{background:var(--done);color:var(--done-text);}
  .btn-skip{background:var(--card);color:var(--muted);border:1px solid var(--border);}
  .btn-prev{background:var(--card);color:var(--muted);border:1px solid var(--border);}

  /* TABS & CONTROLS */
  .tabs{display:flex;gap:6px;padding:8px 12px 2px;overflow-x:auto;}
  .tab{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:11px;white-space:nowrap;cursor:pointer;color:var(--muted);}
  .tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
  .controls{display:flex;gap:8px;padding:10px 12px;align-items:center;}
  .search-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:9px 12px;outline:none;}
  .search-input:focus{border-color:var(--accent2);}
  .search-input::placeholder{color:var(--muted);}
  .add-btn{background:var(--accent2);color:#000;border:none;border-radius:8px;padding:9px 14px;font-family:'Bebas Neue',sans-serif;font-size:18px;cursor:pointer;}

  /* STOP CARDS */
  .stop-list{padding:0 12px 120px;display:flex;flex-direction:column;gap:6px;}
  .stop-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px;position:relative;transition:all 0.2s;}
  .stop-card.active{border-color:var(--accent2);background:#1b2a4a;box-shadow:0 0 12px rgba(79,195,247,0.2);}
  .stop-card.done{opacity:0.4;background:#141a14;border-color:#2a3a2a;}
  .stop-card.skipped{opacity:0.5;border-style:dashed;}
  .stop-seq{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent);min-width:38px;text-align:right;line-height:1;}
  .stop-card.done .stop-seq{color:var(--done-text);}
  .stop-addr{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;word-break:break-word;}
  .stop-note{font-size:10px;color:#ffcc02;margin-top:3px;line-height:1.3;}
  .stop-status{font-size:9px;color:var(--done-text);margin-top:2px;letter-spacing:1px;}
  .stop-actions{display:flex;flex-direction:column;gap:4px;}
  .icon-btn{background:none;border:none;cursor:pointer;padding:4px 6px;font-size:16px;border-radius:6px;line-height:1;}
  .icon-btn:active{background:rgba(255,255,255,0.1);}
  .card-btn-row{display:flex;gap:6px;margin-top:8px;}
  .card-action-btn{flex:1;padding:8px 6px;border:none;border-radius:7px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;cursor:pointer;}
  .card-action-btn:active{opacity:0.65;}
  .card-skip{background:var(--surface);color:var(--muted);border:1px solid var(--border);}
  .card-done{background:var(--done);color:var(--done-text);}
  .card-nav{background:#1a3a2a;color:#a5d6a7;border:1px solid #4caf50;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

  /* MODALS */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;align-items:flex-end;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:20px 20px 0 0;border-top:2px solid var(--accent2);padding:20px 16px 40px;width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px;}
  .modal h3{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent2);letter-spacing:1px;}
  .modal input,.modal textarea{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:10px 12px;outline:none;width:100%;}
  .modal input:focus,.modal textarea:focus{border-color:var(--accent2);}
  .modal textarea{resize:none;height:60px;}
  .modal-row{display:flex;gap:8px;}
  .modal-save{flex:2;background:var(--accent2);color:#000;border:none;border-radius:8px;padding:12px;font-family:'Bebas Neue',sans-serif;font-size:20px;cursor:pointer;}
  .modal-cancel{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'Bebas Neue',sans-serif;font-size:20px;cursor:pointer;}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="route-label" id="route-label">ROUTE R002</div>
      <div class="route-sub" id="route-sub">USPS &bull; OAKLAND CITY IN 47660</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
      <div style="display:flex;gap:6px;">
        <a class="import-link" href="routes.html" style="background:#1b3a2a;color:#a5d6a7;border-color:#4caf50;">&#128466; ROUTES</a>
        <a class="import-link" href="import.html">&#8597; IMPORT</a>
      </div>
      <div style="text-align:right;">
        <div id="done-count" style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--done-text);line-height:1;">0</div>
        <div style="font-size:9px;color:var(--muted);">DONE</div>
      </div>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-text" id="progress-text">0 / 0</div>
  </div>
</div>

<div class="current-banner" id="current-banner">
  <div class="current-label">&#9654; Current Stop</div>
  <div>
    <span class="current-stop-num" id="cur-seq"></span>
    <span style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--muted);margin-left:8px;" id="cur-remaining"></span>
  </div>
  <div class="current-stop-addr" id="cur-addr"></div>
  <div class="current-note" id="cur-note"></div>
  <div class="action-row" style="margin-top:4px;">
    <button class="action-btn btn-prev" onclick="prevStop()">&#9664; PREV</button>
    <button class="action-btn btn-skip" onclick="skipStop()">SKIP</button>
    <button class="action-btn btn-done" onclick="markDone()">&#10003; DONE</button>
  </div>
  <button class="nav-btn" onclick="openGoogleMaps()">&#9664; THIS STOP &mdash; GOOGLE MAPS</button>
  <button class="nav-btn" style="background:#1a3a2a;color:#a5d6a7;border:1px solid #4caf50;margin-top:0;" onclick="openNextNineMaps()">&#9654;&#9654; NAVIGATE FROM HERE &mdash; NEXT 9</button>
  <button class="nav-btn" style="background:var(--surface);color:var(--accent2);border:1px solid var(--accent2);margin-top:0;" onclick="openRouteModal()">&#9776; FULL ROUTE LINKS</button>
  <button class="nav-btn" style="background:#1b3a2a;color:#a5d6a7;border:1px solid #4caf50;margin-top:0;" onclick="quickSave()">&#128190; QUICK SAVE PROGRESS</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="setFilter('all',this)">All</div>
  <div class="tab" onclick="setFilter('pending',this)">Pending</div>
  <div class="tab" onclick="setFilter('done',this)">Done</div>
  <div class="tab" onclick="setFilter('skipped',this)">Skipped</div>
</div>
<div class="controls">
  <input class="search-input" type="search" placeholder="Search address or stop #..." oninput="renderList()" id="search-input">
  <button class="add-btn" onclick="openModal()">+ ADD</button>
</div>
<div class="stop-list" id="stop-list"></div>

<!-- FULL ROUTE MODAL -->
<div class="modal-overlay" id="route-modal-overlay">
  <div class="modal" style="max-height:85vh;overflow-y:auto;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h3 style="color:var(--accent);">FULL ROUTE LINKS</h3>
      <button onclick="closeRouteModal()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;">&#10005;</button>
    </div>
    <p style="font-size:11px;color:var(--muted);line-height:1.5;">Google Maps allows 10 stops per link. Each chunk chains into the next seamlessly.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button onclick="buildRouteLinks('all')" class="modal-save" style="font-size:14px;padding:10px;">ALL STOPS</button>
      <button onclick="buildRouteLinks('pending')" class="modal-save" style="background:var(--accent2);font-size:14px;padding:10px;">PENDING ONLY</button>
    </div>
    <div id="route-links-container" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>
</div>

<!-- ADD/EDIT STOP MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Add Stop</h3>
    <input type="number" id="modal-seq" placeholder="Stop # (leave blank to append)">
    <input type="text" id="modal-addr" placeholder="Street address *">
    <textarea id="modal-note" placeholder="Notes (optional)"></textarea>
    <div class="modal-row">
      <button class="modal-cancel" onclick="closeModal()">CANCEL</button>
      <button class="modal-save" onclick="saveStop()">SAVE STOP</button>
    </div>
  </div>
</div>

let stops = [];
let currentIdx = 0;
let filterMode = 'all';
let editingId = null;

function saveState() {
  try {
    localStorage.setItem('r002_stops', JSON.stringify(stops));
    localStorage.setItem('r002_idx', currentIdx);
    localStorage.setItem('r002_label', document.getElementById('route-label').textContent);
    localStorage.setItem('r002_sub', document.getElementById('route-sub').textContent);
  } catch(e) {}
}

function loadState() {
  try {
    const s = localStorage.getItem('r002_stops');
    const i = localStorage.getItem('r002_idx');
    const lbl = localStorage.getItem('r002_label');
    const sub = localStorage.getItem('r002_sub');
    if (s) { stops = JSON.parse(s); } else { initDefaultStops(); }
    if (i !== null) currentIdx = parseInt(i);
    if (lbl) document.getElementById('route-label').textContent = lbl;
    if (sub) document.getElementById('route-sub').textContent = sub;
  } catch(e) { initDefaultStops(); }
}

function initDefaultStops() {
  stops = DEFAULT_STOPS.map(([seq, addr, note]) => ({
    id: seq, seq, addr, note, status: 'pending'
  }));
}

function getPendingStops() { return stops.filter(s => s.status === 'pending'); }
function getCurrentStop() { return stops[currentIdx] || null; }

function advanceToNextPending() {
  for (let i = currentIdx + 1; i < stops.length; i++) {
    if (stops[i].status === 'pending') { currentIdx = i; return; }
  }
  for (let i = 0; i < currentIdx; i++) {
    if (stops[i].status === 'pending') { currentIdx = i; return; }
  }
}

function markDone() {
  const cur = getCurrentStop(); if (!cur) return;
  cur.status = 'done'; advanceToNextPending(); saveState(); renderAll();
}
function skipStop() {
  const cur = getCurrentStop(); if (!cur) return;
  cur.status = 'skipped'; advanceToNextPending(); saveState(); renderAll();
}
function prevStop() {
  for (let i = currentIdx - 1; i >= 0; i--) {
    if (stops[i].status !== 'done') { currentIdx = i; break; }
  }
  saveState(); renderAll();
}
function jumpTo(id) {
  const idx = stops.findIndex(s => s.id === id);
  if (idx !== -1) { currentIdx = idx; saveState(); renderAll(); }
}
function markStopDone(id) {
  const s = stops.find(x => x.id === id); if (!s) return;
  s.status = 'done';
  if (stops[currentIdx] && stops[currentIdx].id === id) advanceToNextPending();
  saveState(); renderAll();
}
function markStopSkipped(id) {
  const s = stops.find(x => x.id === id); if (!s) return;
  s.status = 'skipped';
  if (stops[currentIdx] && stops[currentIdx].id === id) advanceToNextPending();
  saveState(); renderAll();
}
function markStopPending(id) {
  const s = stops.find(x => x.id === id); if (!s) return;
  s.status = 'pending'; saveState(); renderAll();
}

function addrQ(stop) {
  // Use address only - no city/state/zip appended, avoids geocoder mismatch
  return encodeURIComponent(stop.addr);
}

function buildGoogleMapsUrl(chunkStops) {
  if (!chunkStops.length) return null;
  // maps/dir/ with raw addresses - Maps resolves each one via search
  const parts = chunkStops.map(s => encodeURIComponent(s.addr));
  return 'https://www.google.com/maps/dir/Current+Location/' + parts.join('/');
}

function openGoogleMaps() {
  const cur = getCurrentStop(); if (!cur) return;
  navigateTo(cur.addr);
}
function navigateTo(addr) {
  // google.navigation:q= launches Maps app directly into turn-by-turn from current location
  // No city/state appended - raw street address only to avoid geocoder city bias
  const q = encodeURIComponent(addr);
  const appUri = 'google.navigation:q=' + q + '&mode=d';
  const webUri = 'https://maps.google.com/maps?q=' + q + '&dirflg=d&nav=1';
  let appOpened = false;
  function onHide() { appOpened = true; document.removeEventListener('visibilitychange', onHide); }
  document.addEventListener('visibilitychange', onHide);
  window.location.href = appUri;
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onHide);
    if (!appOpened) window.open(webUri, '_blank');
  }, 1500);
}

function openNextNineMaps() {
  const cur = getCurrentStop(); if (!cur) return;
  const pending = stops.filter(s => s.status === 'pending');
  const idx = pending.findIndex(s => s.id === cur.id);
  const chunk = pending.slice(idx, idx + 9);
  if (!chunk.length) return;
  window.open(buildGoogleMapsUrl(chunk), '_blank');
}
function navToStop(id) {
  const s = stops.find(x => x.id === id); if (!s) return;
  navigateTo(s.addr);
}

function navFromStop(id) {
  const idx = stops.findIndex(x => x.id === id); if (idx === -1) return;
  const chunk = stops.slice(idx).filter(s => s.status !== 'done').slice(0, 9);
  if (!chunk.length) return;
  window.open(buildGoogleMapsUrl(chunk), '_blank');
}

function buildRouteLinks(mode) {
  const src = mode === 'pending' ? stops.filter(s => s.status === 'pending') : stops;
  const container = document.getElementById('route-links-container');
  container.innerHTML = '';
  if (!src.length) { container.innerHTML = '<p style="color:var(--muted);font-size:12px;">No stops.</p>'; return; }
  const chunks = [];
  let pos = 0;
  while (pos < src.length) {
    const end = Math.min(pos + CHUNK_SIZE, src.length);
    chunks.push(src.slice(pos, end));
    pos = end - 1;
    if (end === src.length) break;
  }
  const lbl = document.createElement('p');
  lbl.style.cssText = 'font-size:11px;color:var(--accent2);margin-bottom:4px;';
  lbl.textContent = chunks.length + ' links for ' + src.length + ' stops (' + mode + ')';
  container.appendChild(lbl);
  chunks.forEach((chunk, idx) => {
    const a = document.createElement('a');
    a.href = buildGoogleMapsUrl(chunk);
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.cssText = 'display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--text);';
    a.innerHTML = `<div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);min-width:32px;text-align:center;line-height:1;">${idx+1}</div><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:var(--accent2);">Stops #${chunk[0].seq} &rarr; #${chunk[chunk.length-1].seq}</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">${chunk.length} stops</div><div style="font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;">${chunk[0].addr}</div></div><div style="font-size:22px;color:var(--accent);">&#9654;</div>`;
    container.appendChild(a);
  });
}

function openRouteModal() { document.getElementById('route-modal-overlay').classList.add('open'); buildRouteLinks('pending'); }
function closeRouteModal() { document.getElementById('route-modal-overlay').classList.remove('open'); }

function renderBanner() {
  const cur = getCurrentStop();
  const pending = getPendingStops();
  const done = stops.filter(s => s.status === 'done').length;
  const total = stops.length;
  document.getElementById('done-count').textContent = done;
  document.getElementById('progress-fill').style.width = (done/total*100) + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total;
  if (!cur || !pending.length) {
    document.getElementById('cur-seq').textContent = done === total ? '' : '';
    document.getElementById('cur-addr').textContent = done === total ? 'ROUTE COMPLETE!' : 'No pending stops';
    document.getElementById('cur-note').style.display = 'none';
    document.getElementById('cur-remaining').textContent = '';
    return;
  }
  document.getElementById('cur-seq').textContent = '#' + cur.seq;
  document.getElementById('cur-remaining').textContent = pending.length + ' left';
  document.getElementById('cur-addr').textContent = cur.addr;
  const noteEl = document.getElementById('cur-note');
  if (cur.note) { noteEl.textContent = cur.note; noteEl.style.display = 'block'; }
  else { noteEl.style.display = 'none'; }
}

function renderList() {
  const search = document.getElementById('search-input').value.toLowerCase().trim();
  const list = document.getElementById('stop-list');
  const cur = getCurrentStop();
  let filtered = stops.filter(s => {
    if (filterMode === 'pending' && s.status !== 'pending') return false;
    if (filterMode === 'done' && s.status !== 'done') return false;
    if (filterMode === 'skipped' && s.status !== 'skipped') return false;
    if (search) return s.addr.toLowerCase().includes(search) || String(s.seq).includes(search) || (s.note && s.note.toLowerCase().includes(search));
    return true;
  });
  if (!filtered.length) { list.innerHTML = '<div class="empty-state">No stops match</div>'; return; }
  list.innerHTML = filtered.map(s => {
    const isActive = cur && s.id === cur.id;
    const cls = isActive ? 'stop-card active' : s.status === 'done' ? 'stop-card done' : s.status === 'skipped' ? 'stop-card skipped' : 'stop-card';
    const isDone = s.status === 'done';
    const statusTag = isDone ? '<div class="stop-status">&#10003; DELIVERED</div>' : s.status === 'skipped' ? '<div class="stop-status" style="color:#ef9a9a;">&#x21BB; SKIPPED</div>' : '';
    const btns = !isDone
      ? `<div class="card-btn-row"><button class="card-action-btn card-skip" onclick="markStopSkipped(${s.id})">SKIP</button><button class="card-action-btn card-done" onclick="markStopDone(${s.id})">&#10003; DONE</button><button class="card-action-btn card-nav" onclick="navToStop(${s.id})" style="background:#1a2a3a;color:var(--accent2);border:1px solid var(--accent2);">&#9664; NAV</button><button class="card-action-btn card-nav" onclick="navFromStop(${s.id})">&#9654;&#9654; NAV 9</button></div>`
      : `<div class="card-btn-row"><button class="card-action-btn card-skip" onclick="markStopPending(${s.id})" style="color:var(--muted);">UNDO</button><button class="card-action-btn card-nav" onclick="navToStop(${s.id})" style="background:#1a2a3a;color:var(--accent2);border:1px solid var(--accent2);">&#9664; NAV</button><button class="card-action-btn card-nav" onclick="navFromStop(${s.id})">&#9654;&#9654; NAV 9</button></div>`;
    return `<div class="${cls}" id="card-${s.id}"><div style="display:flex;align-items:flex-start;gap:10px;"><div class="stop-seq">${s.seq}</div><div class="stop-info" style="flex:1;" onclick="jumpTo(${s.id})"><div class="stop-addr">${s.addr}</div>${s.note ? `<div class="stop-note">&#9654; ${s.note}</div>` : ''}${statusTag}</div><div class="stop-actions"><button class="icon-btn" onclick="editStop(${s.id})">&#9998;</button><button class="icon-btn" onclick="moveStop(${s.id},-1)">&#9650;</button><button class="icon-btn" onclick="moveStop(${s.id},1)">&#9660;</button><button class="icon-btn" style="color:#ef9a9a;" onclick="deleteStop(${s.id})">&#10005;</button></div></div>${btns}</div>`;
  }).join('');
  if (cur && !search && filterMode !== 'done') {
    const el = document.getElementById('card-' + cur.id);
    if (el) setTimeout(() => el.scrollIntoView({block:'nearest', behavior:'smooth'}), 100);
  }
}

function renderAll() { renderBanner(); renderList(); }

function moveStop(id, dir) {
  const idx = stops.findIndex(s => s.id === id);
  const ni = idx + dir;
  if (ni < 0 || ni >= stops.length) return;
  [stops[idx], stops[ni]] = [stops[ni], stops[idx]];
  if (currentIdx === idx) currentIdx = ni;
  else if (currentIdx === ni) currentIdx = idx;
  saveState(); renderAll();
}
function deleteStop(id) {
  if (!confirm('Remove stop #' + stops.find(s=>s.id===id)?.seq + '?')) return;
  const idx = stops.findIndex(s => s.id === id);
  stops.splice(idx, 1);
  if (currentIdx >= stops.length) currentIdx = Math.max(0, stops.length - 1);
  saveState(); renderAll();
}
function editStop(id) {
  const s = stops.find(x => x.id === id); if (!s) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Stop #' + s.seq;
  document.getElementById('modal-seq').value = s.seq;
  document.getElementById('modal-addr').value = s.addr;
  document.getElementById('modal-note').value = s.note || '';
  document.getElementById('modal-overlay').classList.add('open');
}
function openModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add Stop';
  document.getElementById('modal-seq').value = '';
  document.getElementById('modal-addr').value = '';
  document.getElementById('modal-note').value = '';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); editingId = null; }
function saveStop() {
  const addr = document.getElementById('modal-addr').value.trim();
  if (!addr) { alert('Address required'); return; }
  const note = document.getElementById('modal-note').value.trim();
  const seqVal = parseInt(document.getElementById('modal-seq').value) || null;
  if (editingId !== null) {
    const s = stops.find(x => x.id === editingId);
    if (s) { s.addr = addr; s.note = note; if (seqVal) s.seq = seqVal; }
  } else {
    const newId = Date.now();
    const newSeq = seqVal || (Math.max(...stops.map(s=>s.seq)) + 1);
    const ns = { id: newId, seq: newSeq, addr, note, status: 'pending' };
    if (seqVal) { const ai = stops.findLastIndex(s => s.seq <= seqVal); stops.splice(ai+1, 0, ns); }
    else stops.push(ns);
  }
  closeModal(); saveState(); renderAll();
}
function setFilter(mode, el) {
  filterMode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

// Modal close on backdrop
document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target===this) closeModal(); });
document.getElementById('route-modal-overlay').addEventListener('click', function(e) { if (e.target===this) closeRouteModal(); });

// ---- QUICK SAVE ----
function quickSave() {
  const label = localStorage.getItem('r002_label') || 'ROUTE R002';
  const today = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const name = label + ' - ' + today;
  const idx_key = 'r002_route_index';
  const prefix  = 'r002_route_';
  let existingId = null;
  try {
    const arr = JSON.parse(localStorage.getItem(idx_key) || '[]');
    for (const id of arr) {
      const r = JSON.parse(localStorage.getItem(prefix + id) || 'null');
      if (r && r.name.toLowerCase() === name.toLowerCase()) { existingId = id; break; }
    }
  } catch(e) {}
  const id = existingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,5));
  const done = stops.filter(s => s.status === 'done').length;
  const routeData = { id, name,
    label: localStorage.getItem('r002_label') || 'ROUTE R002',
    sub:   localStorage.getItem('r002_sub') || '',
    zip:   localStorage.getItem('r002_zip') || ZIP,
    stops, curIdx: currentIdx, savedAt: Date.now(), done, total: stops.length };
  try {
    localStorage.setItem(prefix + id, JSON.stringify(routeData));
    if (!existingId) {
      const arr = JSON.parse(localStorage.getItem(idx_key) || '[]');
      arr.push(id); localStorage.setItem(idx_key, JSON.stringify(arr));
    }
    showToast('Saved: ' + name);
  } catch(e) { showToast('Save failed', true); }
}

let _toastTimer;
function showToast(msg, err=false) {
  let t = document.getElementById('app-toast');
  if (!t) {
    t = document.createElement('div'); t.id = 'app-toast';
    t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:30px;font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:1px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;white-space:nowrap;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = err ? '#b71c1c' : '#2e7d32';
  t.style.color = err ? '#ffcdd2' : '#81c784';
  t.style.opacity = '1';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.style.opacity = '0', 2200);
}

// Reset (5 taps on route label)
let tapCount = 0;
document.getElementById('route-label').addEventListener('click', () => {
  if (++tapCount >= 5) {
    if (confirm('Reset all stops to pending?')) { stops.forEach(s => s.status='pending'); currentIdx=0; saveState(); renderAll(); }
    tapCount = 0;
  }
  setTimeout(() => tapCount=0, 2000);
});

// ---- BACK BUTTON / BFCACHE FIX ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// Re-render from storage whenever page becomes visible (returning from Maps)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { loadState(); renderAll(); }
});
window.addEventListener('pageshow', e => {
  if (e.persisted) { loadState(); renderAll(); }
});

// ---- INIT ----
loadState();
if (stops[currentIdx] && stops[currentIdx].status !== 'pending') advanceToNextPending();
renderAll();
</script>
